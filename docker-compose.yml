# Entorno local: SQL Server + API
#   docker compose up --build
#   Swagger: http://localhost:8080/swagger
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "NexusPlan_Dev123!"
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'NexusPlan_Dev123!' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      retries: 10

  api:
    build: .
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=NexusPlan;User Id=sa;Password=NexusPlan_Dev123!;TrustServerCertificate=True;"
    ports:
      - "8080:8080"
